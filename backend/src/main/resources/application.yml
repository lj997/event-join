server:
  port: 8080

spring:
  application:
    name: event-join-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/event_join?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: test
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: EventJoinSecretKeyForJwtTokenGeneration2026
  expiration: 86400000

logging:
  level:
    com.eventjoin: DEBUG
    org.hibernate.SQL: DEBUG
